name: SE Asia Wind Maps (925/850/700 hPa)

# Manual trigger only -- press "Run workflow" in the Actions tab (works from
# the GitHub mobile app too).
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years to include"
        required: false
        default: "2015,2019,2023,2026"
      window_end:
        description: "End of shared calendar window as MM-DD (blank = today minus lag_days, same window applied to every year)"
        required: false
        default: ""
      lag_days:
        description: "Days behind today to use as window_end when window_end is blank (ERA5T publication lag buffer)"
        required: false
        default: "6"
      skip_download:
        description: "Reuse cached data/ files instead of re-downloading from CDS"
        required: false
        default: "false"
        type: boolean

jobs:
  build-wind-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for cartopy
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-bin proj-data

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure CDS API credentials
        env:
          # Falls back to the default CDS API endpoint when the
          # CDS_API_URL secret isn't set -- only override it if your
          # CDS account uses a non-default endpoint.
          CDS_API_URL: ${{ secrets.CDS_API_URL || 'https://cds.climate.copernicus.eu/api' }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          cat > ~/.cdsapirc <<EOF
          url: ${CDS_API_URL}
          key: ${CDS_API_KEY}
          EOF

      - name: Compute cache key
        id: cachekey
        run: |
          # Keyed on today's UTC date too: the shared window's end date
          # (today minus lag_days, when window_end isn't set explicitly)
          # moves forward daily, so yesterday's cached partial-month files
          # must not be reused as if they covered today's day count.
          YEARS_SAFE=$(echo '${{ github.event.inputs.years }}' | tr ',' '_')
          echo "key=era5-daily-$(date -u +%Y%m%d)-${YEARS_SAFE}-${{ github.event.inputs.window_end }}" >> "$GITHUB_OUTPUT"

      - name: Cache CDS downloads
        uses: actions/cache@v4
        with:
          path: data
          key: ${{ steps.cachekey.outputs.key }}

      - name: Run download + plot script
        run: |
          ARGS="--years ${{ github.event.inputs.years }} --lag-days ${{ github.event.inputs.lag_days }}"
          if [ -n "${{ github.event.inputs.window_end }}" ]; then
            ARGS="$ARGS --window-end ${{ github.event.inputs.window_end }}"
          fi
          if [ "${{ github.event.inputs.skip_download }}" = "true" ]; then
            ARGS="$ARGS --skip-download"
          fi
          python scripts/fetch_and_plot_winds.py $ARGS

      - name: Upload figure as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-maps
          path: outputs/*.png
          retention-days: 30
